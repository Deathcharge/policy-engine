name: Release artifact

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m mypy policy_engine
      - run: python -m pytest --cov=policy_engine --cov-report=term-missing
      - name: Check tag and package versions
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          from policy_engine import __version__

          expected = os.environ["RELEASE_TAG"].removeprefix("v")
          if __version__ != expected:
              raise SystemExit(f"tag {expected!r} does not match package {__version__!r}")
          PY
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Smoke-test wheel
        run: |
          python -m venv /tmp/samsarix-policy-release
          /tmp/samsarix-policy-release/bin/python -m pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/samsarix-policy-release/bin/samsarix-policy --version
          /tmp/samsarix-policy-release/bin/python -I -c "from importlib.resources import files; import policy_engine; assert files('policy_engine').joinpath('schemas', 'decision.schema.json').is_file()"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: samsarix-policy-engine-${{ github.run_id }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
