name: Release artifact

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m mypy policy_engine
      - run: python -m pytest --cov=policy_engine --cov-report=term-missing
      - run: python -m pip_audit --local --progress-spinner off
      - name: Check tag and package versions
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          from policy_engine import __version__

          expected = os.environ["RELEASE_TAG"].removeprefix("v")
          if __version__ != expected:
              raise SystemExit(f"tag {expected!r} does not match package {__version__!r}")
          PY
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify distributions and installed journeys
        run: python scripts/verify_distribution.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: samsarix-policy-engine-${{ github.run_id }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
