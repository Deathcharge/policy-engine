[build-system]
requires = ["setuptools>=83,<84", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "samsarix-policy-engine"
version = "0.1.0"
description = "Deterministic, local-first policy decisions for agent and automation actions"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "BUSL-1.1"
license-files = ["LICENSE"]
authors = [{ name = "Samsarix LLC", email = "contact@samsarix.com" }]
maintainers = [{ name = "Samsarix Support", email = "support@samsarix.com" }]
keywords = ["samsarix", "authorization", "policy", "agents", "automation", "guardrails"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "jsonschema>=4.23,<5",
    "mypy>=1.15,<3",
    "pip-audit>=2.7,<3",
    "pip>=26.2,<27",
    "pyperf>=2.10,<3",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
    "setuptools>=83,<84",
    "twine>=6,<8",
    "wheel>=0.45,<1",
]

[project.scripts]
samsarix-policy = "policy_engine.cli:main"

[project.urls]
Homepage = "https://www.samsarix.com"
Repository = "https://github.com/Deathcharge/policy-engine.git"
Issues = "https://github.com/Deathcharge/policy-engine/issues"
Documentation = "https://github.com/Deathcharge/policy-engine/tree/main/docs"
Changelog = "https://github.com/Deathcharge/policy-engine/blob/main/CHANGELOG.md"
Support = "https://www.samsarix.com/help"
"Commercial licensing" = "https://www.samsarix.com/pricing"

[tool.setuptools]
packages = ["policy_engine", "policy_engine.schemas"]
include-package-data = true

[tool.setuptools.package-data]
policy_engine = ["py.typed", "schemas/*.json"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["policy_engine"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
strict = true
files = ["policy_engine"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
